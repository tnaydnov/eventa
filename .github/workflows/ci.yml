name: CI

# The app is offline; retain checks for manual use only.
on:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Hard gate: the full unit + integration suite must pass before build/deploy.
      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Dummy values so the build doesn't fail on env validation
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Performance regression check
        run: npm run perf:regression
